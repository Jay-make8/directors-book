<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--@TITLE--></title>
<style>
:root {
  --bg: #f6f7f9;
  --panel: #ffffff;
  --text: #1f2328;
  --muted: #667085;
  --line: #e4e7ec;
  --accent: #2563eb;
  --accent-soft: #e8efff;
  --code-bg: #f3f5f8;
  --warn-bg: #fff7e6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14161a;
    --panel: #1c1f25;
    --text: #e6e8eb;
    --muted: #9aa3b2;
    --line: #2d323b;
    --accent: #6b9bff;
    --accent-soft: #232c40;
    --code-bg: #15181d;
    --warn-bg: #2b2616;
  }
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
  font-size: 15px;
  line-height: 1.7;
}
.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 16px;
  padding: 10px 24px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.topbar .project { font-size: 17px; font-weight: 600; }
.topbar .tag {
  padding: 1px 10px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 13px;
}
.layout { display: flex; align-items: flex-start; max-width: 1180px; margin: 0 auto; }
nav.side {
  position: sticky;
  top: 52px;
  flex: 0 0 200px;
  max-height: calc(100vh - 52px);
  overflow-y: auto;
  padding: 20px 12px 20px 24px;
}
nav.side a {
  display: block;
  padding: 3px 8px;
  border-radius: 6px;
  color: var(--text);
  text-decoration: none;
}
nav.side a:hover { background: var(--accent-soft); color: var(--accent); }
nav.side .top-item { margin-top: 10px; font-weight: 600; }
nav.side .sub-item { padding-left: 20px; color: var(--muted); font-size: 14px; }
main { flex: 1; min-width: 0; max-width: 900px; padding: 20px 24px 80px; }
section.part { margin-bottom: 48px; scroll-margin-top: 64px; }
h2 {
  margin: 0 0 16px;
  padding-bottom: 8px;
  border-bottom: 2px solid var(--accent);
  font-size: 22px;
}
h3 { margin: 24px 0 8px; font-size: 17px; }
h4 { margin: 16px 0 6px; font-size: 15px; color: var(--muted); }
.card {
  margin: 12px 0;
  padding: 14px 18px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
}
.txt { white-space: pre-wrap; word-break: break-word; margin: 6px 0; }
table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 14px; }
th, td { padding: 6px 10px; border: 1px solid var(--line); text-align: left; vertical-align: top; }
th { background: var(--code-bg); font-weight: 600; }
table.overview th, table.overview td { font-size: 13.5px; }
table.overview td:nth-child(1), table.overview td:nth-child(2), table.overview td:nth-child(3), table.overview td:nth-child(7), table.overview th { white-space: nowrap; }
.shot { margin: 10px 0; }
.shot-title { font-weight: 600; color: var(--accent); }
.shot-body { white-space: pre-wrap; word-break: break-word; }
.segment { scroll-margin-top: 64px; }
.segment > .seg-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.segment .seg-title { font-size: 18px; font-weight: 600; }
.segment .seg-meta { color: var(--muted); font-size: 13px; }
.block { margin: 12px 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.block-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 12px;
  background: var(--code-bg);
  border-bottom: 1px solid var(--line);
  font-weight: 600;
  font-size: 14px;
}
pre.prompt {
  margin: 0;
  padding: 12px 14px;
  white-space: pre-wrap;
  word-break: break-word;
  font-family: inherit;
  font-size: 14.5px;
  line-height: 1.7;
}
button.copy {
  flex: none;
  padding: 3px 12px;
  border: 1px solid var(--accent);
  border-radius: 6px;
  background: transparent;
  color: var(--accent);
  font: inherit;
  font-size: 13px;
  cursor: pointer;
}
button.copy:hover { background: var(--accent-soft); }
button.copy.done { background: var(--accent); color: #fff; }
.hint { margin: 8px 0; padding: 8px 12px; background: var(--warn-bg); border-radius: 6px; color: var(--muted); font-size: 13.5px; }
footer { margin-top: 40px; color: var(--muted); font-size: 13px; text-align: center; }
@media (max-width: 900px) {
  .layout { display: block; }
  nav.side {
    position: static;
    max-height: none;
    padding: 10px 16px 0;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  nav.side .top-item { margin-top: 0; padding-right: 14px; }
  nav.side .sub-item { flex-basis: 100%; padding-left: 16px; }
  main { padding: 12px 16px 60px; }
}
@media print {
  .topbar, nav.side, button.copy { display: none !important; }
  body { background: #fff; color: #000; }
  .card, .block { break-inside: avoid; }
  main { max-width: none; padding: 0; }
}
</style>
</head>
<body>
<header class="topbar">
<!--@META-->
</header>
<div class="layout">
<nav class="side" aria-label="目录">
<!--@NAV-->
</nav>
<main>
<!--@BODY-->
<footer>由 directors-book 生成 · MIT License</footer>
</main>
</div>
<script>
(function () {
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(
        function () { return true; },
        function () { return fallbackCopy(text); }
      );
    }
    return Promise.resolve(fallbackCopy(text));
  }
  // 目录和表格里的锚点链接：用脚本滚动，不依赖浏览器的 # 跳转（某些预览环境里 # 跳转不生效）
  document.addEventListener('click', function (e) {
    var a = e.target.closest ? e.target.closest('a[href^="#"]') : null;
    if (!a) return;
    var id = decodeURIComponent(a.getAttribute('href').slice(1));
    var target = document.getElementById(id);
    if (!target) return;
    e.preventDefault();
    if (target.scrollIntoView) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  document.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('button.copy') : null;
    if (!btn) return;
    var el = document.getElementById(btn.getAttribute('data-target'));
    if (!el) return;
    if (!btn.getAttribute('data-label')) btn.setAttribute('data-label', btn.textContent);
    copyText(el.textContent).then(function (ok) {
      btn.textContent = ok ? '已复制' : '复制失败，请手动选中';
      btn.classList.toggle('done', ok);
      clearTimeout(btn._timer);
      btn._timer = setTimeout(function () {
        btn.textContent = btn.getAttribute('data-label');
        btn.classList.remove('done');
      }, 2000);
    });
  });
})();
</script>
</body>
</html>
