<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica Neue, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111c3d"/>
      <stop offset="1" stop-color="#1d3f9e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="holes" x="0" y="0" width="44" height="30" patternUnits="userSpaceOnUse">
      <rect x="12" y="8" width="20" height="14" rx="4" fill="#ffffff" fill-opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#glow)"/>

  <!-- 胶片边 -->
  <rect x="0" y="0" width="1280" height="30" fill="#000000" fill-opacity="0.35"/>
  <rect x="0" y="0" width="1280" height="30" fill="url(#holes)"/>
  <rect x="0" y="390" width="1280" height="30" fill="#000000" fill-opacity="0.35"/>
  <rect x="0" y="390" width="1280" height="30" fill="url(#holes)"/>

  <!-- 右侧淡淡的播放标志 -->
  <circle cx="1060" cy="192" r="82" fill="#ffffff" fill-opacity="0.05" stroke="#93c5fd" stroke-opacity="0.35" stroke-width="2"/>
  <path d="M1040 154 L1040 230 L1102 192 Z" fill="#93c5fd" fill-opacity="0.55"/>

  <!-- 标题 -->
  <text x="80" y="142" font-size="92" font-weight="800" fill="#ffffff" letter-spacing="6">导演手册</text>
  <text x="84" y="190" font-size="30" font-weight="600" fill="#93c5fd" letter-spacing="7" font-family="SF Mono, Menlo, Consolas, monospace">directors-book</text>
  <text x="84" y="234" font-size="26" fill="#cbd5e1">面向 Seedance 视频生成的 agent skill</text>

  <!-- 版本 -->
  <g transform="translate(1086,62)">
    <rect width="132" height="38" rx="19" fill="#2563eb"/>
    <text x="66" y="26" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">v5.0.0 · MIT</text>
  </g>

  <!-- 流程：四个阶段，每个都能单选，整合成一个 HTML -->
  <g font-size="26" font-weight="600" text-anchor="middle">
    <rect x="80" y="296" width="196" height="64" rx="14" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.5"/>
    <text x="178" y="337" fill="#ffffff">剧本</text>

    <rect x="326" y="296" width="196" height="64" rx="14" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.5"/>
    <text x="424" y="337" fill="#ffffff">分镜</text>

    <rect x="572" y="296" width="196" height="64" rx="14" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.5"/>
    <text x="670" y="337" fill="#ffffff">资产包</text>

    <rect x="818" y="296" width="196" height="64" rx="14" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.5"/>
    <text x="916" y="337" fill="#ffffff">视频提示词</text>

    <rect x="1064" y="296" width="136" height="64" rx="14" fill="#2563eb"/>
    <text x="1132" y="337" fill="#ffffff">导演手册</text>
  </g>

  <!-- 箭头 -->
  <g fill="#60a5fa">
    <path d="M288 328 L314 328 L306 320 M314 328 L306 336" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M534 328 L560 328 L552 320 M560 328 L552 336" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M780 328 L806 328 L798 320 M806 328 L798 336" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M1026 328 L1052 328 L1044 320 M1052 328 L1044 336" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <text x="80" y="272" font-size="17" fill="#94a3b8" letter-spacing="2">四个阶段，每个都能单独使用，也可以整合成一个可一键复制的 HTML 导演手册</text>
</svg>
